services:
  airflow:
    build:
      context: .
      dockerfile: Dockerfile
      network: host  # <--- ADICIONE ESTA LINHA AQUI
    image: weather-airflow:phase6
    container_name: weather-airflow
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Sao_Paulo
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW_CONN_DATABRICKS_DEFAULT: "databricks://"
      AIRFLOW_VAR_WEATHER_DATABRICKS_JOB_ID: 1115529242462150
      AIRFLOW_VAR_WEATHER_DATABRICKS_HOST: "https://dbc-39ee3252-8e93.cloud.databricks.com"

      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      _AIRFLOW_WWW_USER_FIRSTNAME: Admin
      _AIRFLOW_WWW_USER_LASTNAME: User
      _AIRFLOW_WWW_USER_ROLE: Admin
      _AIRFLOW_WWW_USER_EMAIL: admin@example.com

    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./plugins:/opt/airflow/plugins
      - ./config:/opt/airflow/config

    command: standalone