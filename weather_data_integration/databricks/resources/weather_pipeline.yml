resources:
  jobs:
    weather_pipeline:
      name: weather-data-integration-${bundle.target}
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 * * * ?"
        timezone_id: "America/Sao_Paulo"
        pause_status: PAUSED
      tasks:
        - task_key: environment_validation
          notebook_task:
            notebook_path: ../notebooks/phase4/01_environment_validation.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: incremental_bronze
          depends_on:
            - task_key: environment_validation
          notebook_task:
            notebook_path: ../notebooks/phase3/01_incremental_bronze.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: incremental_silver
          depends_on:
            - task_key: incremental_bronze
          notebook_task:
            notebook_path: ../notebooks/phase3/02_incremental_silver.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: data_quality
          depends_on:
            - task_key: incremental_silver
          notebook_task:
            notebook_path: ../notebooks/phase3/03_data_quality_metrics.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: data_quality_gate
          depends_on:
            - task_key: data_quality
          notebook_task:
            notebook_path: ../notebooks/phase7/01_data_quality_gate.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              min_quality_score: ${var.min_quality_score}

        - task_key: incremental_gold
          depends_on:
            - task_key: data_quality_gate
          notebook_task:
            notebook_path: ../notebooks/phase3/04_gold_incremental.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: ai_features
          depends_on:
            - task_key: incremental_gold
          notebook_task:
            notebook_path: ../notebooks/phase5/01_ai_features.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: ai_anomaly_detection
          depends_on:
            - task_key: ai_features
          notebook_task:
            notebook_path: ../notebooks/phase5/02_anomaly_detection.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: ai_insights
          depends_on:
            - task_key: ai_anomaly_detection
          notebook_task:
            notebook_path: ../notebooks/phase5/03_ai_insights.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              enable_llm: "false"

        - task_key: operational_metadata
          depends_on:
            - task_key: ai_insights
          notebook_task:
            notebook_path: ../notebooks/phase7/02_operational_metadata.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: operational_smoke_test
          depends_on:
            - task_key: operational_metadata
          notebook_task:
            notebook_path: ../notebooks/phase7/03_operational_smoke.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: smoke_test
          depends_on:
            - task_key: operational_smoke_test
          notebook_task:
            notebook_path: ../notebooks/phase4/02_smoke_check.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
