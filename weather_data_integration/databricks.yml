bundle:
  name: weather-data-integration

include:
  - databricks/resources/*.yml

variables:
  databricks_host:
    description: Databricks workspace URL
    default: ""
  catalog:
    description: Unity Catalog catalog used by the environment
    default: main
  schema:
    description: Environment-specific schema
    default: weather_dev
  min_quality_score:
    description: minimum quality score
    default: 0.95

sync:
  include:
    - src/**
    - databricks/**
    - architecture/**
    #- docs/**

artifacts: {}

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-39ee3252-8e93.cloud.databricks.com
    variables:
      catalog: dev
      schema: weather_dev
      min_quality_score: 0.95

  prod:
    mode: production
    workspace:
      host: https://dbc-39ee3252-8e93.cloud.databricks.com
    variables:
      catalog: prod
      schema: weather_prod
